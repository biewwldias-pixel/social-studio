name: Build Windows SocialStudio.exe

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5

      - name: Instalar dependências + PyInstaller + pywebview
        shell: pwsh
        run: |
          uv sync
          uv pip install pywebview pyinstaller

      - name: Gerar SocialStudio.exe
        shell: pwsh
        run: |
          uv run pyinstaller `
            --noconfirm `
            --onefile `
            --windowed `
            --name SocialStudio `
            --icon "static/icon.ico" `
            --add-data "static;static" `
            --add-data "brands;brands" `
            --collect-all google.antigravity `
            desktop.py

      - name: Publicar artefato SocialStudio.exe
        uses: actions/upload-artifact@v4
        with:
          name: SocialStudio-Windows
          path: dist/SocialStudio.exe

      - name: Publicar GitHub Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag dist/SocialStudio.exe `
            --title "Social Studio $tag" `
            --notes "Executável portátil do **Social Studio** para Windows.`n`n1. Baixe \`SocialStudio.exe\` abaixo e dê dois cliques.`n2. Clique em **⚙** para configurar sua \`GEMINI_API_KEY\`, Cloudflare R2 e perfis do Instagram (ou clique em **?** para abrir o guia completo)."
