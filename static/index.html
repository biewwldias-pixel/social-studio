              </button>
            </div>
            <div id="analyzeLog" class="analyze-log"></div>
            <div class="field" id="guideEditorWrap" style="${settingsState.guideOpen ? "" : "display:none"}">
              <span class="field-label-row">
                <span>Arquivo de regras (${escapeAttr(brand.id)}.md)</span>
                <span class="mono">Editável</span>
              </span>
              <textarea id="brandGuideInput" class="guide-editor" rows="10" placeholder="Clique em ✨ Entender Design para gerar automaticamente...">${escapeAttr(guideText)}</textarea>
            </div>
          </div>

          <div class="settings-section">
            <div class="settings-section-head">
              <span class="settings-section-title">Conta do Instagram</span>
              <span class="settings-section-desc">Credenciais da Meta Graph API para publicar direto neste perfil.</span>
            </div>
            <div class="field">
              <span class="field-label-row">Instagram Account ID</span>
              <input id="brandAccountIdInput" type="text" value="${escapeAttr(brand.accountId)}" />
            </div>
            <div class="field">
              <span class="field-label-row">Access Token</span>
              <input id="brandAccessTokenInput" type="password" value="${escapeAttr(brand.accessToken)}" />
            </div>
          </div>

          ${
            state.brands.length > 1
              ? `<div class="row" style="justify-content:flex-end">
                  <button type="button" class="btn btn-sm btn-danger" id="deleteBrandBtn">Remover perfil ${escapeAttr(brand.name)}</button>
                </div>`
              : ""
          }
        `;

        $("pickBrandProjectBtn").onclick = () =>
          pickFolderInto($("brandProjectPathInput"), $("pickBrandProjectBtn"));
        $("pickBrandPostsBtn").onclick = () =>
          pickFolderInto($("brandPostsDirInput"), $("pickBrandPostsBtn"));

        $("toggleGuideBtn").onclick = () => {
          settingsState.guideOpen = !settingsState.guideOpen;
          $("guideEditorWrap").style.display = settingsState.guideOpen ? "" : "none";
          $("toggleGuideBtn").textContent = settingsState.guideOpen
            ? "Ocultar guia (.md)"
            : "Ver / Editar guia (.md)";
        };

        $("analyzeDesignBtn").onclick = async () => {
          if (settingsState.isAnalyzing) return;
          // Salva o caminho da pasta antes de analisar caso o usuário tenha acabado de alterar
          await fetch(`/api/brands/${brand.id}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              name: $("brandNameInput").value,
              projectPath: $("brandProjectPathInput").value,
              postsDir: $("brandPostsDirInput").value,
              accountId: $("brandAccountIdInput").value,
              accessToken: $("brandAccessTokenInput").value,
            }),
          });

          settingsState.isAnalyzing = true;
          const btn = $("analyzeDesignBtn");
          const log = $("analyzeLog");
          btn.disabled = true;
          btn.textContent = "Analisando projeto...";
          log.classList.add("open");
          log.textContent = "Inspecionando arquivos, tokens, fontes e posts existentes...\n";

          try {
            const res = await fetch(`/api/brands/${brand.id}/analyze-design`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                model: "gemini-4-neon",
                thinking: "medium",
              }),
            });
            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let buffer = "";
            while (true) {
              const { value, done } = await reader.read();
              if (done) break;
              buffer += decoder.decode(value, { stream: true });
              const lines = buffer.split("\n\n");
              buffer = lines.pop() || "";
              for (const line of lines) {
                if (!line.startsWith("data: ")) continue;
                const event = JSON.parse(line.slice(6));
                if (event.type === "tool") {
                  log.textContent += `⚡ ${event.name}\n`;
                } else if (event.type === "token") {
                  log.textContent += event.text;
                } else if (event.type === "error") {
                  log.textContent += `\nErro: ${event.message}\n`;
                } else if (event.type === "done") {
                  settingsState.guideCache[brand.id] = event.guide || "";
                  if (event.postsDir && $("brandPostsDirInput")) {
                    $("brandPostsDirInput").value = event.postsDir;
                  }
                  if ($("brandGuideInput")) {
                    $("brandGuideInput").value = event.guide || "";
                  }
                  settingsState.guideOpen = true;
                  showGlobalToast(`Design de ${brand.name} mapeado com sucesso!`);
                }
                log.scrollTop = log.scrollHeight;
              }
            }
            await loadBrands();
            renderSettingsTabs();
            renderSettingsBody();
          } catch (err) {
            log.textContent += `\nErro: ${err.message}\n`;
          } finally {
            settingsState.isAnalyzing = false;
            if ($("analyzeDesignBtn")) {
              $("analyzeDesignBtn").disabled = false;
              $("analyzeDesignBtn").textContent = "✨ Entender Design";
            }
          }
        };

        if ($("deleteBrandBtn")) {
          $("deleteBrandBtn").onclick = async () => {
            if (!confirm(`Remover o perfil "${brand.name}" do Social Studio? (Os arquivos do projeto não são apagados.)`)) {
              return;
            }
            const res = await fetch(`/api/brands/${brand.id}`, { method: "DELETE" });
            if (res.ok) {
              delete settingsState.guideCache[brand.id];
              await loadBrands();
              settingsState.activeTab = state.brands[0]?.id || "__new";
              renderSettingsTabs();
              renderSettingsBody();
              showGlobalToast(`Perfil ${brand.name} removido.`);
            }
          };
        }
      }

      $("openSettingsBtn").onclick = async () => {
        const res = await fetch("/api/settings");
        const data = await res.json();
        settingsState.r2Values = data.values || {};
        settingsState.guideCache = {};
        await switchSettingsTab(state.brandId);
        $("settingsModal").showModal();
      };
      $("closeSettingsBtn").onclick = () => $("settingsModal").close();
      $("settingsForm").onsubmit = async (e) => {
        e.preventDefault();
        const tab = settingsState.activeTab;
        if (tab === "__r2") {
          const values = {};
          for (const key of R2_KEYS) {
            const input = $("env_" + key);
            if (input) values[key] = input.value;
          }
          await fetch("/api/settings", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ values }),
          });
          $("settingsModal").close();
          showGlobalToast("Configurações do R2 salvas!");
          return;
        }
        if (tab === "__new") {
          const name = $("newBrandName").value.trim();
          if (!name) return;
          const res = await fetch("/api/brands", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              name,
              projectPath: $("newBrandProjectPath").value,
              accountId: $("newBrandAccountId").value,
              accessToken: $("newBrandAccessToken").value,
            }),
          });
          if (res.ok) {
            const created = await res.json();
            state.brandId = created.id;
            await loadBrands();
            await switchSettingsTab(created.id);
            showGlobalToast(`Perfil "${created.name}" criado! Agora clique em ✨ Entender Design.`);
          }
          return;
        }
        const payload = {
          name: $("brandNameInput").value,
          projectPath: $("brandProjectPathInput").value,
          postsDir: $("brandPostsDirInput").value,
          accountId: $("brandAccountIdInput").value,
          accessToken: $("brandAccessTokenInput").value,
        };
        if (settingsState.guideOpen && $("brandGuideInput")) {
          payload.guide = $("brandGuideInput").value;
          settingsState.guideCache[tab] = payload.guide;
        }
        await fetch(`/api/brands/${tab}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        $("settingsModal").close();
        await loadBrands();
        showGlobalToast("Alterações salvas!");
      };

      async function silentCheckUpdate() {
        try {
          const res = await fetch("/api/update/check");
          if (!res.ok) return;
          const info = await res.json();
          settingsState.updateInfo = info;
          if (info.updateAvailable) {
            const btn = $("openSettingsBtn");
            btn.title = `Configurações (Atualização v${info.latestVersion} disponível!)`;
            btn.innerHTML = `⚙ <span class="status-dot ok"></span>`;
          }
        } catch {}
      }

      loadBrands();
      silentCheckUpdate();
    </script>
  </body>
</html>
